[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roleplay-diary"
version = "0.3.0a0"
description = "Archive your roleplay characters from beginning to end."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["roleplay", "gta-world", "character", "diary", "archive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
]
# tkinter is part of Python itself, so the interface needs nothing installed.
dependencies = [
    "reportlab>=4.0,<6",
    "pillow>=10.0",
]

[project.gui-scripts]
roleplay-diary = "controller:main"

[tool.setuptools]
py-modules = ["model", "view", "controller"]

[tool.ruff]
line-length = 96
target-version = "py311"
